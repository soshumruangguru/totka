<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekap Cabang · TKA SMA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --ink:#12141B;
    --surface:#1A1D26;
    --surface-2:#212530;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.16);
    --text:#EDEEF3;
    --muted:#9299AB;
    --muted-2:#6B7183;
    --amber:#E8A33D;
    --amber-soft: rgba(232,163,61,0.14);
    --teal:#54B8AC;
    --teal-soft: rgba(84,184,172,0.14);
    --coral:#E2694F;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Space Grotesk', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding: 28px 20px 60px;
  }
  .num{ font-family:'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

  .wrap{ max-width:1220px; margin:0 auto; }

  /* Header */
  header{
    display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
    gap:20px; margin-bottom:26px; padding-bottom:22px; border-bottom:1px solid var(--line);
  }
  .brand-eyebrow{ font-size:12.5px; color:var(--amber); letter-spacing:0.02em; margin:0 0 6px; }
  h1{ font-size:26px; font-weight:600; margin:0 0 6px; letter-spacing:-0.01em; }
  header p.sub{ margin:0; color:var(--muted); font-size:14px; max-width:520px; line-height:1.5; }

  .filter-group{ display:flex; gap:12px; flex-wrap:wrap; }
  .picker{ display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
  .picker label{ font-size:11.5px; color:var(--muted-2); }
  select{
    background:var(--surface); color:var(--text); border:1px solid var(--line-strong);
    border-radius:8px; padding:9px 12px; font-family:inherit; font-size:13.5px;
    min-width:220px; cursor:pointer;
  }
  select:focus{ outline:2px solid var(--amber); outline-offset:1px; }

  /* Stat strip */
  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
  .stat{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px;
  }
  .stat .lbl{ font-size:11.5px; color:var(--muted-2); margin-bottom:8px; }
  .stat .val{ font-size:24px; font-weight:600; }
  .stat .val.amber{ color:var(--amber); }
  .stat .val.teal{ color:var(--teal); }
  .stat .sub2{ font-size:12px; color:var(--muted); margin-top:4px; }

  .special-row{ margin-bottom:28px; }
  .special-row .special-label{ font-size:11.5px; color:var(--muted-2); margin-bottom:10px; }
  .special-cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .special-card{
    background:var(--surface); border:1px dashed var(--line-strong); border-radius:12px;
    padding:14px 16px; display:flex; flex-direction:column; gap:8px;
  }
  .special-card .name{ font-size:13px; font-weight:500; color:var(--text); }
  .special-card .metrics{ display:flex; gap:18px; }
  .special-card .metric .k{ font-size:11px; color:var(--muted-2); margin-bottom:2px; }
  .special-card .metric .v{ font-size:17px; font-weight:600; }
  .special-card .metric .v.teal{ color:var(--teal); }
  .special-card .metric .v.amber{ color:var(--amber); }

  /* Tabs */
  .tabs{ display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tab-btn{
    background:none; border:none; color:var(--muted); font-family:inherit; font-size:14px;
    padding:10px 4px; margin-right:22px; cursor:pointer; border-bottom:2px solid transparent;
    transition: color .15s ease, border-color .15s ease;
  }
  .tab-btn.active{ color:var(--text); border-bottom-color:var(--amber); }
  .tab-btn:hover{ color:var(--text); }

  .panel{ display:none; }
  .panel.active{ display:block; }

  /* Controls row */
  .controls{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:16px; }
  .search-box{ position:relative; flex:1; min-width:220px; }
  .search-box input{
    width:100%; background:var(--surface); border:1px solid var(--line-strong); color:var(--text);
    border-radius:8px; padding:9px 12px 9px 34px; font-family:inherit; font-size:13.5px;
  }
  .search-box input:focus{ outline:2px solid var(--amber); outline-offset:1px; }
  .search-box svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.5; }
  .count-pill{ font-size:12px; color:var(--muted); white-space:nowrap; }

  /* Mapel multi-select checklist */
  .mapel-multiselect{ position:relative; min-width:220px; }
  .ms-toggle{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--surface); color:var(--text); border:1px solid var(--line-strong);
    border-radius:8px; padding:9px 12px; font-family:inherit; font-size:13.5px; cursor:pointer;
  }
  .ms-toggle:focus{ outline:2px solid var(--amber); outline-offset:1px; }
  .ms-toggle svg{ flex-shrink:0; opacity:.6; transition:transform .15s ease; }
  .mapel-multiselect.open .ms-toggle svg{ transform:rotate(180deg); }
  .ms-toggle-label{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; }
  .ms-panel{
    position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:20;
    background:var(--surface-2); border:1px solid var(--line-strong); border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35); padding:8px; min-width:240px;
  }
  .ms-panel[hidden]{ display:none; }
  .ms-actions{ display:flex; gap:8px; padding:2px 4px 8px; border-bottom:1px solid var(--line); margin-bottom:6px; }
  .ms-actions button{
    background:none; border:none; color:var(--amber); font-family:inherit; font-size:12px;
    cursor:pointer; padding:2px 0;
  }
  .ms-actions button:hover{ text-decoration:underline; }
  .ms-options{ max-height:260px; overflow-y:auto; display:flex; flex-direction:column; gap:2px; }
  .ms-option{
    display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:6px; cursor:pointer; font-size:13px;
  }
  .ms-option:hover{ background:rgba(255,255,255,0.05); }
  .ms-option input{ accent-color:var(--amber); width:15px; height:15px; cursor:pointer; flex-shrink:0; }
  th.mapel-group-first{ border-left:1px solid var(--line-strong); }
  th .th-mapel-name{ display:block; font-size:11px; color:var(--text); font-weight:600; margin-bottom:2px; }

  /* Table */
  .table-scroll{ overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--surface); }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; min-width:640px; }
  thead th{
    text-align:left; padding:11px 14px; font-weight:500; color:var(--muted);
    font-size:12px; border-bottom:1px solid var(--line-strong); background:var(--surface-2);
    position:sticky; top:0; cursor:pointer; white-space:nowrap; user-select:none;
  }
  thead th.num-col{ text-align:right; }
  thead th.no-sort{ cursor:default; }
  thead th:hover{ color:var(--text); }
  thead th .arrow{ opacity:0; margin-left:4px; font-size:10px; }
  thead th.sorted .arrow{ opacity:1; color:var(--amber); }
  tbody td{ padding:10px 14px; border-bottom:1px solid var(--line); }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:rgba(255,255,255,0.025); }
  td.num-col{ text-align:right; }
  td.branch-cell{ font-weight:500; }
  td.region-cell{ color:var(--muted); font-size:12.5px; }
  .rank-idx{ color:var(--muted-2); font-size:11.5px; width:28px; display:inline-block; }
  .bar-cell{ display:flex; align-items:center; gap:8px; justify-content:flex-end; }
  .bar-track{ width:64px; height:6px; background:rgba(255,255,255,0.07); border-radius:3px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--teal); border-radius:3px; }
  .bar-fill.amber{ background:var(--amber); }
  .empty-row td{ text-align:center; color:var(--muted-2); padding:32px; }

  /* Branch detail panel */
  .branch-select-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  .branch-select-row select{ flex:1; min-width:260px; }

  .detail-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
  .detail-head h2{ font-size:19px; margin:0; font-weight:600; }
  .detail-head .meta{ color:var(--muted); font-size:13px; }

  .mapel-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
  .mapel-card{
    background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 15px;
  }
  .mapel-card .name{ font-size:12.5px; color:var(--muted); margin-bottom:10px; }
  .mapel-card .row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .mapel-card .row .k{ font-size:11.5px; color:var(--muted-2); }
  .mapel-card .row .v{ font-size:16px; font-weight:600; }
  .mapel-card .row .v.amber{ color:var(--amber); }
  .mapel-card .row .v.teal{ color:var(--teal); }
  .mapel-card.zero{ opacity:.4; }
  .mapel-card .track{ height:5px; border-radius:3px; background:rgba(255,255,255,0.07); margin-top:8px; overflow:hidden;}
  .mapel-card .track .f{ height:100%; background:var(--teal); border-radius:3px; }

  .badge{
    display:inline-block; font-size:11px; padding:3px 8px; border-radius:20px;
    background:var(--teal-soft); color:var(--teal); margin-left:8px; vertical-align:middle;
  }

  footer{ margin-top:34px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted-2); font-size:12px; line-height:1.6; }

  @media (max-width:720px){
    .stats{ grid-template-columns:repeat(2,1fr); }
    header{ flex-direction:column; align-items:flex-start; }
    .filter-group{ width:100%; }
    .picker{ align-items:flex-start; flex:1; }
    select{ width:100%; min-width:0; }
  }
</style>
</head>

            <button type="button" id="msSelectAll">Pilih semua</button>
            <button type="button" id="msClear">Hapus semua</button>
          </div>
          <div class="ms-options" id="msOptions"></div>
        </div>
      </div>
      <span class="count-pill" id="rowCountPill"></span>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr id="mapelHeadRow">
            <th style="width:30px" class="no-sort"></th>
            <th data-key="branch">Cabang <span class="arrow">▾</span></th>
            <th data-key="region">Regional <span class="arrow">▾</span></th>
          </tr>
        </thead>
        <tbody id="mapelTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- PANEL 2: per cabang -->
  <div class="panel" id="panel-percabang">
    <div class="branch-select-row">
      <div class="search-box" style="flex:1;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="branchPickerSearch" placeholder="Cari cabang…">
      </div>
      <select id="branchSelect"></select>
    </div>
    <div class="detail-head">
      <h2 id="detailBranchName">—</h2>
      <span class="meta" id="detailBranchMeta"></span>
    </div>
    <div class="mapel-grid" id="mapelGrid"></div>
  </div>

  <!-- PANEL 3: per regional -->
  <div class="panel" id="panel-perregional">
    <div class="controls">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="regionSearch" placeholder="Cari regional…">
      </div>
      <div class="mapel-multiselect" id="mapelMultiSelectRegion">
        <button type="button" class="ms-toggle" id="msToggleBtnRegion" aria-haspopup="true" aria-expanded="false">
          <span class="ms-toggle-label" id="msToggleLabelRegion">Pilih mapel…</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="ms-panel" id="msPanelRegion" hidden>
          <div class="ms-actions">
            <button type="button" id="msSelectAllRegion">Pilih semua</button>
            <button type="button" id="msClearRegion">Hapus semua</button>
          </div>
          <div class="ms-options" id="msOptionsRegion"></div>
        </div>
      </div>
      <span class="count-pill" id="rowCountPillRegion"></span>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr id="regionHeadRow">
            <th style="width:30px" class="no-sort"></th>
            <th data-key="region">Regional <span class="arrow">▾</span></th>
            <th class="num-col" data-key="branchCount">Jumlah Cabang <span class="arrow">▾</span></th>
          </tr>
        </thead>
        <tbody id="regionTableBody"></tbody>
      </table>
    </div>
  </div>

  <footer id="footerNote"></footer>

</div>

<script>
const DATA = JSON.parse(document.getElementById('raw-data').textContent);
const { events, mapelCols, mapelSelectOptions, mapelLabels, regions, branchMeta, data, specialBranches, specialData } = DATA;
const ALL_KEY = 'ALL';

document.getElementById('footerNote').textContent =
  `Jumlah peserta hanya menghitung siswa dengan skor > 0 pada mapel terkait; skor 0 (tidak mengerjakan) diabaikan dari jumlah peserta maupun rata-rata. Skala nilai bisa berbeda antar event (mis. Premium vs Reguler), jadi berhati-hatilah saat membandingkan rata-rata lintas event pada tampilan "Semua Event". "Semua Mapel" pada filter mapel menjumlahkan pengerjaan di semua 14 mapel dan merata-ratakan seluruh skornya. "BAO" dan "Non BA" adalah kategori peserta yang tidak terafiliasi ke cabang fisik, sehingga tidak masuk ke tabel/filter cabang atau regional. "BAC" adalah rollup dari seluruh cabang fisik digabung menjadi satu (tidak terpengaruh filter Regional).`;

const REGION_ALL = "Semua Regional";

let state = {
  event: events[0],
  region: REGION_ALL,
  mapelMulti: [mapelCols[0]],
  mapelMultiRegion: [mapelCols[0]],
  sortKey: 'branch',
  sortDir: 'asc',
  sortKeyRegion: 'branchCount',
  sortDirRegion: 'desc',
  branchSearch: '',
  regionSearch: '',
  selectedBranch: null,
};

function getRegion(branch) {
  const meta = branchMeta[branch];
  return meta ? meta.region : 'Tidak Terpetakan';
}

function branchMatchesRegion(branch) {
  return state.region === REGION_ALL || getRegion(branch) === state.region;
}

// ---------- populate selects ----------
const eventSelect = document.getElementById('eventSelect');
events.forEach(ev => {
  const opt = document.createElement('option');
  opt.value = ev; opt.textContent = ev;
  eventSelect.appendChild(opt);
});
eventSelect.value = state.event;
eventSelect.addEventListener('change', () => {
  state.event = eventSelect.value;
  render();
});

const regionSelect = document.getElementById('regionSelect');
[REGION_ALL, ...regions].forEach(t => {
  const opt = document.createElement('option');
  opt.value = t; opt.textContent = t;
  regionSelect.appendChild(opt);
});
regionSelect.value = state.region;
regionSelect.addEventListener('change', () => {
  state.region = regionSelect.value;
  render();
});

function populateMapelSelect(el, boundKey) {
  mapelSelectOptions.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = mapelLabels[c] || c;
    el.appendChild(opt);
  });
  el.value = state[boundKey];
}

// ---------- mapel multi-select checklist ----------
const msWrap = document.getElementById('mapelMultiSelect');
const msToggleBtn = document.getElementById('msToggleBtn');
const msToggleLabel = document.getElementById('msToggleLabel');
const msPanel = document.getElementById('msPanel');
const msOptions = document.getElementById('msOptions');

mapelSelectOptions.forEach(c => {
  const label = document.createElement('label');
  label.className = 'ms-option';
  label.innerHTML = `<input type="checkbox" value="${c}"><span>${escapeHtml(mapelLabels[c] || c)}</span>`;
  msOptions.appendChild(label);
});

function syncMsCheckboxes() {
  msOptions.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.checked = state.mapelMulti.includes(cb.value);
  });
}

function updateMsLabel() {
  if (state.mapelMulti.length === 0) {
    msToggleLabel.textContent = 'Pilih mapel…';
  } else if (state.mapelMulti.length === 1) {
    msToggleLabel.textContent = mapelLabels[state.mapelMulti[0]] || state.mapelMulti[0];
  } else {
    msToggleLabel.textContent = `${state.mapelMulti.length} mapel dipilih`;
  }
}

msOptions.addEventListener('change', (e) => {
  const cb = e.target;
  if (cb.type !== 'checkbox') return;
  if (cb.checked) {
    if (!state.mapelMulti.includes(cb.value)) state.mapelMulti.push(cb.value);
  } else {
    state.mapelMulti = state.mapelMulti.filter(v => v !== cb.value);
  }
  updateMsLabel();
  renderMapelTable();
});

document.getElementById('msSelectAll').addEventListener('click', () => {
  state.mapelMulti = [...mapelSelectOptions];
  syncMsCheckboxes();
  updateMsLabel();
  renderMapelTable();
});

document.getElementById('msClear').addEventListener('click', () => {
  state.mapelMulti = [];
  syncMsCheckboxes();
  updateMsLabel();
  renderMapelTable();
});

msToggleBtn.addEventListener('click', () => {
  const isOpen = msWrap.classList.toggle('open');
  msPanel.hidden = !isOpen;
  msToggleBtn.setAttribute('aria-expanded', String(isOpen));
});

document.addEventListener('click', (e) => {
  if (!msWrap.contains(e.target)) {
    msWrap.classList.remove('open');
    msPanel.hidden = true;
    msToggleBtn.setAttribute('aria-expanded', 'false');
  }
});

syncMsCheckboxes();
updateMsLabel();

// ---------- mapel multi-select checklist (per-regional) ----------
const msWrapRegion = document.getElementById('mapelMultiSelectRegion');
const msToggleBtnRegion = document.getElementById('msToggleBtnRegion');
const msToggleLabelRegion = document.getElementById('msToggleLabelRegion');
const msPanelRegion = document.getElementById('msPanelRegion');
const msOptionsRegion = document.getElementById('msOptionsRegion');

mapelSelectOptions.forEach(c => {
  const label = document.createElement('label');
  label.className = 'ms-option';
  label.innerHTML = `<input type="checkbox" value="${c}"><span>${escapeHtml(mapelLabels[c] || c)}</span>`;
  msOptionsRegion.appendChild(label);
});

function syncMsCheckboxesRegion() {
  msOptionsRegion.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.checked = state.mapelMultiRegion.includes(cb.value);
  });
}

function updateMsLabelRegion() {
  if (state.mapelMultiRegion.length === 0) {
    msToggleLabelRegion.textContent = 'Pilih mapel…';
  } else if (state.mapelMultiRegion.length === 1) {
    msToggleLabelRegion.textContent = mapelLabels[state.mapelMultiRegion[0]] || state.mapelMultiRegion[0];
  } else {
    msToggleLabelRegion.textContent = `${state.mapelMultiRegion.length} mapel dipilih`;
  }
}

msOptionsRegion.addEventListener('change', (e) => {
  const cb = e.target;
  if (cb.type !== 'checkbox') return;
  if (cb.checked) {
    if (!state.mapelMultiRegion.includes(cb.value)) state.mapelMultiRegion.push(cb.value);
  } else {
    state.mapelMultiRegion = state.mapelMultiRegion.filter(v => v !== cb.value);
  }
  updateMsLabelRegion();
  renderRegionTable();
});

document.getElementById('msSelectAllRegion').addEventListener('click', () => {
  state.mapelMultiRegion = [...mapelSelectOptions];
  syncMsCheckboxesRegion();
  updateMsLabelRegion();
  renderRegionTable();
});

document.getElementById('msClearRegion').addEventListener('click', () => {
  state.mapelMultiRegion = [];
  syncMsCheckboxesRegion();
  updateMsLabelRegion();
  renderRegionTable();
});

msToggleBtnRegion.addEventListener('click', () => {
  const isOpen = msWrapRegion.classList.toggle('open');
  msPanelRegion.hidden = !isOpen;
  msToggleBtnRegion.setAttribute('aria-expanded', String(isOpen));
});

document.addEventListener('click', (e) => {
  if (!msWrapRegion.contains(e.target)) {
    msWrapRegion.classList.remove('open');
    msPanelRegion.hidden = true;
    msToggleBtnRegion.setAttribute('aria-expanded', 'false');
  }
});

syncMsCheckboxesRegion();
updateMsLabelRegion();

document.getElementById('branchSearch').addEventListener('input', (e) => {
  state.branchSearch = e.target.value.trim().toLowerCase();
  renderMapelTable();
});

document.getElementById('regionSearch').addEventListener('input', (e) => {
  state.regionSearch = e.target.value.trim().toLowerCase();
  renderRegionTable();
});

// tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

// sortable headers (per-mapel table) — delegated, since mapel columns are rebuilt on every render
document.querySelector('#panel-permapel thead').addEventListener('click', (e) => {
  const th = e.target.closest('th[data-key]');
  if (!th) return;
  const key = th.dataset.key;
  if (state.sortKey === key) {
    state.sortDir = state.sortDir === 'desc' ? 'asc' : 'desc';
  } else {
    state.sortKey = key;
    state.sortDir = (key === 'branch' || key === 'region') ? 'asc' : 'desc';
  }
  renderMapelTable();
});

// sortable headers (per-region table) — delegated, since mapel columns are rebuilt on every render
document.querySelector('#panel-perregional thead').addEventListener('click', (e) => {
  const th = e.target.closest('th[data-key]');
  if (!th) return;
  const key = th.dataset.key;
  if (state.sortKeyRegion === key) {
    state.sortDirRegion = state.sortDirRegion === 'desc' ? 'asc' : 'desc';
  } else {
    state.sortKeyRegion = key;
    state.sortDirRegion = (key === 'region') ? 'asc' : 'desc';
  }
  renderRegionTable();
});

// ---------- stats row ----------
function renderStats() {
  const branches = data[state.event];
  const branchNames = Object.keys(branches).filter(branchMatchesRegion);
  let totalPeserta = 0;
  let mapelTotals = {};
  mapelCols.forEach(c => mapelTotals[c] = 0);
  branchNames.forEach(b => {
    totalPeserta += branches[b].totalPeserta;
    mapelCols.forEach(c => { mapelTotals[c] += branches[b].mapel[c].count; });
  });
  let topMapel = mapelCols.reduce((a,b) => mapelTotals[a] > mapelTotals[b] ? a : b);

  const statsRow = document.getElementById('statsRow');
  statsRow.innerHTML = `
    <div class="stat">
      <div class="lbl">Jumlah Cabang</div>
      <div class="val num">${branchNames.length}</div>
    </div>
    <div class="stat">
      <div class="lbl">Total Peserta (skor &gt; 0, unik)</div>
      <div class="val num teal">${totalPeserta.toLocaleString('id-ID')}</div>
    </div>
    <div class="stat">
      <div class="lbl">Mapel Terpopuler</div>
      <div class="val amber">${mapelLabels[topMapel]}</div>
      <div class="sub2 num">${mapelTotals[topMapel].toLocaleString('id-ID')} pengerjaan</div>
    </div>
    <div class="stat">
      <div class="lbl">Filter Aktif</div>
      <div class="val" style="font-size:14.5px; line-height:1.4;">${state.region}</div>
      <div class="sub2">${state.event}</div>
    </div>
  `;
}

// ---------- special (non-branch) categories ----------
function renderSpecialCards() {
  const container = document.getElementById('specialCards');
  const evData = specialData[state.event] || {};
  container.innerHTML = specialBranches.map(name => {
    const b = evData[name];
    const total = b ? b.totalPeserta : 0;
    const allMapel = b ? b.mapel[ALL_KEY] : { count: 0, avg: 0 };
    return `
      <div class="special-card">
        <div class="name">${escapeHtml(name)}</div>
        <div class="metrics">
          <div class="metric">
            <div class="k">Total Peserta (skor &gt; 0, unik)</div>
            <div class="v teal num">${total.toLocaleString('id-ID')}</div>
          </div>
          <div class="metric">
            <div class="k">Rata-rata (semua mapel)</div>
            <div class="v amber num">${allMapel.count ? allMapel.avg.toLocaleString('id-ID', {maximumFractionDigits:2}) : '–'}</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// ---------- per-mapel table ----------
function renderMapelTable() {
  const branches = data[state.event];
  const selected = state.mapelMulti;
  const colCount = 3 + selected.length * 2;

  // rebuild the dynamic per-mapel header cells (one "Jumlah" + one "Rata-rata" per mapel dipilih)
  const headRow = document.getElementById('mapelHeadRow');
  headRow.querySelectorAll('th.mapel-col').forEach(th => th.remove());
  selected.forEach(m => {
    const thCount = document.createElement('th');
    thCount.className = 'num-col mapel-col mapel-group-first';
    thCount.dataset.key = `count::${m}`;
    thCount.innerHTML = `<span class="th-mapel-name">${escapeHtml(mapelLabels[m] || m)}</span>Jumlah <span class="arrow">▾</span>`;
    headRow.appendChild(thCount);

    const thAvg = document.createElement('th');
    thAvg.className = 'num-col mapel-col';
    thAvg.dataset.key = `avg::${m}`;
    thAvg.innerHTML = `Rata-rata <span class="arrow">▾</span>`;
    headRow.appendChild(thAvg);
  });

  document.querySelectorAll('#panel-permapel thead th[data-key]').forEach(th => {
    th.classList.toggle('sorted', th.dataset.key === state.sortKey);
    const arrow = th.querySelector('.arrow');
    if (arrow) arrow.textContent = state.sortDir === 'asc' ? '▴' : '▾';
  });

  const tbody = document.getElementById('mapelTableBody');

  if (selected.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="${colCount}">Pilih minimal satu mapel untuk dibandingkan.</td></tr>`;
    document.getElementById('rowCountPill').textContent = '0 cabang';
    return;
  }

  let rows = Object.keys(branches)
    .filter(branchMatchesRegion)
    .map(b => {
      const row = { branch: b, region: getRegion(b) };
      selected.forEach(m => {
        row[`count__${m}`] = branches[b].mapel[m].count;
        row[`avg__${m}`] = branches[b].mapel[m].avg;
      });
      return row;
    });

  if (state.branchSearch) {
    rows = rows.filter(r => r.branch.toLowerCase().includes(state.branchSearch));
  }

  rows.sort((a,b) => {
    if (state.sortKey === 'branch' || state.sortKey === 'region') {
      const av = a[state.sortKey], bv = b[state.sortKey];
      return state.sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    }
    const [metric, m] = state.sortKey.split('::');
    const av = a[`${metric}__${m}`] ?? 0;
    const bv = b[`${metric}__${m}`] ?? 0;
    return state.sortDir === 'asc' ? av - bv : bv - av;
  });

  const maxByCol = {};
  selected.forEach(m => {
    maxByCol[`count__${m}`] = Math.max(1, ...rows.map(r => r[`count__${m}`]));
    maxByCol[`avg__${m}`] = Math.max(1, ...rows.map(r => r[`avg__${m}`]));
  });

  if (rows.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="${colCount}">Tidak ada cabang yang cocok.</td></tr>`;
  } else {
    tbody.innerHTML = rows.map((r, i) => `
      <tr>
        <td><span class="rank-idx num">${i+1}</span></td>
        <td class="branch-cell">${escapeHtml(r.branch)}</td>
        <td class="region-cell">${escapeHtml(r.region)}</td>
        ${selected.map(m => `
          <td class="num-col mapel-group-first">
            <div class="bar-cell">
              <span class="num">${r[`count__${m}`].toLocaleString('id-ID')}</span>
              <span class="bar-track"><span class="bar-fill" style="width:${(r[`count__${m}`]/maxByCol[`count__${m}`]*100).toFixed(0)}%"></span></span>
            </div>
          </td>
          <td class="num-col">
            <div class="bar-cell">
              <span class="num">${r[`avg__${m}`] > 0 ? r[`avg__${m}`].toLocaleString('id-ID', {maximumFractionDigits:2}) : '–'}</span>
              <span class="bar-track"><span class="bar-fill amber" style="width:${(r[`avg__${m}`]/maxByCol[`avg__${m}`]*100).toFixed(0)}%"></span></span>
            </div>
          </td>
        `).join('')}
      </tr>
    `).join('');
  }

  document.getElementById('rowCountPill').textContent = `${rows.length} cabang`;
}

// ---------- per-region table ----------
function renderRegionTable() {
  const branches = data[state.event];
  const branchNames = Object.keys(branches).filter(branchMatchesRegion);
  const selected = state.mapelMultiRegion;
  const colCount = 3 + selected.length * 2;

  // rebuild kolom mapel dinamis (satu "Jumlah Peserta" + satu "Rata-rata Nilai" per mapel terpilih)
  const headRow = document.getElementById('regionHeadRow');
  headRow.querySelectorAll('th.mapel-col').forEach(th => th.remove());
  selected.forEach(m => {
    const thCount = document.createElement('th');
    thCount.className = 'num-col mapel-col mapel-group-first';
    thCount.dataset.key = `count::${m}`;
    thCount.innerHTML = `<span class="th-mapel-name">${escapeHtml(mapelLabels[m] || m)}</span>Jumlah Peserta <span class="arrow">▾</span>`;
    headRow.appendChild(thCount);

    const thAvg = document.createElement('th');
    thAvg.className = 'num-col mapel-col';
    thAvg.dataset.key = `avg::${m}`;
    thAvg.innerHTML = `Rata-rata Nilai <span class="arrow">▾</span>`;
    headRow.appendChild(thAvg);
  });

  document.querySelectorAll('#panel-perregional thead th[data-key]').forEach(th => {
    th.classList.toggle('sorted', th.dataset.key === state.sortKeyRegion);
    const arrow = th.querySelector('.arrow');
    if (arrow) arrow.textContent = state.sortDirRegion === 'asc' ? '▴' : '▾';
  });

  const tbody = document.getElementById('regionTableBody');

  if (selected.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="${colCount}">Pilih minimal satu mapel untuk dibandingkan.</td></tr>`;
    document.getElementById('rowCountPillRegion').textContent = '0 regional';
    return;
  }

  const byRegion = {};
  branchNames.forEach(b => {
    const t = getRegion(b);
    if (!byRegion[t]) {
      byRegion[t] = { branchCount: 0 };
      selected.forEach(m => { byRegion[t][`count__${m}`] = 0; byRegion[t][`sum__${m}`] = 0; });
    }
    byRegion[t].branchCount += 1;
    selected.forEach(m => {
      const mm = branches[b].mapel[m];
      byRegion[t][`count__${m}`] += mm.count;
      byRegion[t][`sum__${m}`] += mm.avg * mm.count;
    });
  });

  let rows = Object.keys(byRegion).map(t => {
    const row = { region: t, branchCount: byRegion[t].branchCount };
    selected.forEach(m => {
      const c = byRegion[t][`count__${m}`];
      row[`count__${m}`] = c;
      row[`avg__${m}`] = c > 0 ? Math.round((byRegion[t][`sum__${m}`] / c) * 100) / 100 : 0;
    });
    return row;
  });

  if (state.regionSearch) {
    rows = rows.filter(r => r.region.toLowerCase().includes(state.regionSearch));
  }

  rows.sort((a,b) => {
    if (state.sortKeyRegion === 'region') {
      return state.sortDirRegion === 'asc' ? a.region.localeCompare(b.region) : b.region.localeCompare(a.region);
    }
    if (state.sortKeyRegion === 'branchCount') {
      return state.sortDirRegion === 'asc' ? a.branchCount - b.branchCount : b.branchCount - a.branchCount;
    }
    const [metric, m] = state.sortKeyRegion.split('::');
    const av = a[`${metric}__${m}`] ?? 0;
    const bv = b[`${metric}__${m}`] ?? 0;
    return state.sortDirRegion === 'asc' ? av - bv : bv - av;
  });

  const maxByCol = {};
  selected.forEach(m => {
    maxByCol[`count__${m}`] = Math.max(1, ...rows.map(r => r[`count__${m}`]));
    maxByCol[`avg__${m}`] = Math.max(1, ...rows.map(r => r[`avg__${m}`]));
  });

  if (rows.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="${colCount}">Tidak ada regional yang cocok.</td></tr>`;
  } else {
    tbody.innerHTML = rows.map((r, i) => `
      <tr>
        <td><span class="rank-idx num">${i+1}</span></td>
        <td class="branch-cell">${escapeHtml(r.region)}</td>
        <td class="num-col num">${r.branchCount}</td>
        ${selected.map(m => `
          <td class="num-col mapel-group-first">
            <div class="bar-cell">
              <span class="num">${r[`count__${m}`].toLocaleString('id-ID')}</span>
              <span class="bar-track"><span class="bar-fill" style="width:${(r[`count__${m}`]/maxByCol[`count__${m}`]*100).toFixed(0)}%"></span></span>
            </div>
          </td>
          <td class="num-col">
            <div class="bar-cell">
              <span class="num">${r[`avg__${m}`] > 0 ? r[`avg__${m}`].toLocaleString('id-ID', {maximumFractionDigits:2}) : '–'}</span>
              <span class="bar-track"><span class="bar-fill amber" style="width:${(r[`avg__${m}`]/maxByCol[`avg__${m}`]*100).toFixed(0)}%"></span></span>
            </div>
          </td>
        `).join('')}
      </tr>
    `).join('');
  }

  document.getElementById('rowCountPillRegion').textContent = `${rows.length} regional`;
}

// ---------- per-branch detail ----------
const branchSelect = document.getElementById('branchSelect');
const branchPickerSearch = document.getElementById('branchPickerSearch');

function populateBranchSelect() {
  const branches = Object.keys(data[state.event]).filter(branchMatchesRegion).sort((a,b) => a.localeCompare(b));
  const filter = branchPickerSearch.value.trim().toLowerCase();
  const filtered = filter ? branches.filter(b => b.toLowerCase().includes(filter)) : branches;
  branchSelect.innerHTML = filtered.map(b => `<option value="${escapeAttr(b)}">${escapeHtml(b)}</option>`).join('');
  if (filtered.length) {
    if (!state.selectedBranch || !filtered.includes(state.selectedBranch)) {
      state.selectedBranch = filtered[0];
    }
    branchSelect.value = state.selectedBranch;
  } else {
    state.selectedBranch = null;
  }
  renderBranchDetail();
}

branchPickerSearch.addEventListener('input', populateBranchSelect);
branchSelect.addEventListener('change', () => {
  state.selectedBranch = branchSelect.value;
  renderBranchDetail();
});

function renderBranchDetail() {
  const nameEl = document.getElementById('detailBranchName');
  const metaEl = document.getElementById('detailBranchMeta');
  const grid = document.getElementById('mapelGrid');

  if (!state.selectedBranch || !data[state.event][state.selectedBranch]) {
    nameEl.textContent = '—';
    metaEl.textContent = '';
    grid.innerHTML = '';
    return;
  }

  const b = data[state.event][state.selectedBranch];
  const region = getRegion(state.selectedBranch);
  nameEl.innerHTML = `${escapeHtml(state.selectedBranch)} <span class="badge">${escapeHtml(region)}</span>`;
  metaEl.textContent = `${b.totalPeserta.toLocaleString('id-ID')} peserta unik (skor > 0) · ${state.event}`;

  const maxCount = Math.max(1, ...mapelCols.map(c => b.mapel[c].count));

  grid.innerHTML = mapelCols.map(c => {
    const m = b.mapel[c];
    const zero = m.count === 0;
    return `
      <div class="mapel-card ${zero ? 'zero' : ''}">
        <div class="name">${mapelLabels[c]}</div>
        <div class="row"><span class="k">Peserta</span><span class="v teal num">${m.count.toLocaleString('id-ID')}</span></div>
        <div class="row"><span class="k">Rata-rata</span><span class="v amber num">${m.count ? m.avg.toLocaleString('id-ID', {maximumFractionDigits:2}) : '–'}</span></div>
        <div class="track"><div class="f" style="width:${(m.count/maxCount*100).toFixed(0)}%"></div></div>
      </div>
    `;
  }).join('');
}

// ---------- helpers ----------
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }

function render() {
  renderStats();
  renderSpecialCards();
  renderMapelTable();
  renderRegionTable();
  populateBranchSelect();
}

render();
</script>
</body>
</html>
